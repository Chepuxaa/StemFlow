name: Source checks
on: [push, pull_request]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python scripts/check_repository.py
      - run: python -m pip install certifi==2026.7.22 truststore==0.10.5 pillow==12.2.0 mutagen==1.48.1 numpy==2.5.4 soundfile==0.14.0 imageio-ffmpeg==0.6.0 onnx==1.23.2 onnxruntime==1.31.0
      - run: python -m unittest discover -s tests
